name: sideband_mobile
description: Sideband payer/provider mobile app (Testnet/synthetic only, pre-release).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cryptography: ^2.7.0
  sideband_protocol:
    git:
      url: https://github.com/Sideband34/Sideband-protocol.git
      ref: main
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  # BLE central/peripheral (BSD-3). Pinned: adapter is untested on hardware.
  universal_ble: 3.1.2
  go_router: ^18.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/demo/session-transcript.json
    - brand/icon-192.png

# Launcher icons are generated from the approved brand mark (brand/mark.svg)
# rendered onto the brand background. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/launcher/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#130B12"
  adaptive_icon_foreground: "assets/launcher/foreground.png"
  min_sdk_android: 21
